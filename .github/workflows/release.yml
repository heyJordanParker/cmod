name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find what this version still needs
        id: version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          for package in core cli; do
            own=$(node -p "require('./$package/package.json').version")
            [ "$own" = "$version" ] || { echo "$package/package.json is $own but .claude-plugin/plugin.json is $version"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@cmodjs/core@$version" version > /dev/null 2>&1; then echo "core=done" >> "$GITHUB_OUTPUT"; fi
          if npm view "@cmodjs/cli@$version" version > /dev/null 2>&1; then echo "cli=done" >> "$GITHUB_OUTPUT"; fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then echo "release=done" >> "$GITHUB_OUTPUT"; fi

      - if: steps.version.outputs.core != 'done' || steps.version.outputs.cli != 'done' || steps.version.outputs.release != 'done'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - if: steps.version.outputs.core != 'done' || steps.version.outputs.cli != 'done' || steps.version.outputs.release != 'done'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Write Claude Code's types, which the build reads
        if: steps.version.outputs.core != 'done' || steps.version.outputs.cli != 'done' || steps.version.outputs.release != 'done'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --plugin-dir . -p ok || true
          test -d .claude-plugin/types

      - name: Test and build @cmodjs/core and @cmodjs/cli
        if: steps.version.outputs.core != 'done' || steps.version.outputs.cli != 'done' || steps.version.outputs.release != 'done'
        run: |
          bun install --cwd core --frozen-lockfile
          bun install --cwd cli --frozen-lockfile
          bun run --cwd core check
          (cd core && bun test)
          bun run --cwd core build
          bun run --cwd cli check
          (cd cli && bun test)

      - name: Publish @cmodjs/core to npm
        if: steps.version.outputs.core != 'done'
        working-directory: core
        run: npm publish --provenance

      - name: Publish @cmodjs/cli to npm
        if: steps.version.outputs.cli != 'done'
        working-directory: cli
        run: npm publish --provenance

      - name: Release the CMod plugin and the cmod program on GitHub
        if: steps.version.outputs.release != 'done'
        run: |
          version=${{ steps.version.outputs.version }}
          until npm view "@cmodjs/core@$version" version > /dev/null 2>&1 && npm view "@cmodjs/cli@$version" version > /dev/null 2>&1; do sleep 5; done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm bun.lock
          bun install
          bun test
          bun x tsc --noEmit
          if ! git diff --quiet bun.lock; then
            git add bun.lock
            git commit -m "chore: the CMod plugin installs @cmodjs/core and @cmodjs/cli $version"
          fi
          bun cli/src/main.ts publish
