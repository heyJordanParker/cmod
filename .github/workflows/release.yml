name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find what this version still needs
        id: version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          for package in core cli; do
            own=$(node -p "require('./$package/package.json').version")
            [ "$own" = "$version" ] || { echo "$package/package.json is $own but .claude-plugin/plugin.json is $version"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@cmodjs/core@$version" version > /dev/null 2>&1; then echo "core=done" >> "$GITHUB_OUTPUT"; fi
          if npm view "@cmodjs/cli@$version" version > /dev/null 2>&1; then echo "cli=done" >> "$GITHUB_OUTPUT"; fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then echo "release=done" >> "$GITHUB_OUTPUT"; fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Write Claude Code's types, which the build reads
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          CLAUDE_CODE_PLUGIN_DIR_WATCH=1 "$HOME/.local/bin/claude" --plugin-dir . -p ok || true
          test -d .claude-plugin/types

      - name: Build @cmodjs/core and put it in the cmod plugin
        run: |
          bun install --cwd lint --frozen-lockfile
          bun install --cwd core --frozen-lockfile
          bun install --cwd cli --frozen-lockfile
          bun install --frozen-lockfile
          bun run --cwd core build
          (cd core && bun pm pack --quiet --destination "$RUNNER_TEMP")
          rm -rf node_modules/@cmodjs/core
          mkdir node_modules/@cmodjs/core
          tar -xzf "$RUNNER_TEMP/cmodjs-core-${{ steps.version.outputs.version }}.tgz" -C node_modules/@cmodjs/core --strip-components=1

      - name: Run every suite at once
        run: |
          suites=(
            'bun run --cwd lint test'
            'bun run --cwd cli check'
            'bun run --cwd core check'
            'bun x tsc --noEmit'
            'OXLINT_TSGOLINT_PATH=lint/node_modules/.bin/tsgolint lint/node_modules/.bin/oxlint --type-aware --deny-warnings src hooks setup tests'
            'bun test'
            'cd core && bun test'
            'bun run --cwd cli test'
          )
          for index in "${!suites[@]}"; do
            bash -ec "time { ${suites[$index]}; }" > "$RUNNER_TEMP/suite-$index.log" 2>&1 &
            pids[$index]=$!
          done
          failed=0
          for index in "${!suites[@]}"; do
            code=0
            wait "${pids[$index]}" || code=$?
            echo "\$ ${suites[$index]}"
            cat "$RUNNER_TEMP/suite-$index.log"
            if [ "$code" != 0 ]; then echo "::error::${suites[$index]} exited $code"; failed=1; fi
          done
          exit "$failed"

      - name: Publish @cmodjs/core to npm
        if: steps.version.outputs.core != 'done'
        working-directory: core
        run: npm publish --provenance

      - name: Publish @cmodjs/cli to npm
        if: steps.version.outputs.cli != 'done'
        working-directory: cli
        run: npm publish --provenance

      - name: Release the cmod plugin and the cmod program on GitHub
        if: steps.version.outputs.release != 'done'
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved from $GITHUB_SHA to $main during this run, so the run for $main releases the cmod plugin"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun cli/src/main.ts publish
