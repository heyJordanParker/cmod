name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release

env:
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      core: ${{ steps.version.outputs.core }}
      cli: ${{ steps.version.outputs.cli }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Find what this version still needs
        id: version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          for package in core cli; do
            own=$(node -p "require('./$package/package.json').version")
            [ "$own" = "$version" ] || { echo "$package/package.json is $own but .claude-plugin/plugin.json is $version"; exit 1; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@cmodjs/core@$version" version > /dev/null 2>&1; then echo "core=done" >> "$GITHUB_OUTPUT"; fi
          if npm view "@cmodjs/cli@$version" version > /dev/null 2>&1; then echo "cli=done" >> "$GITHUB_OUTPUT"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then echo "release=done" >> "$GITHUB_OUTPUT"; fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Write Claude Code's types while the suites that need none run
        run: |
          (
            curl -fsSL https://claude.ai/install.sh | bash -s latest
            CLAUDE_CODE_PLUGIN_DIR_WATCH=1 "$HOME/.local/bin/claude" --plugin-dir . -p ok || true
          ) > "$RUNNER_TEMP/claude-code.log" 2>&1 &
          claude_code=$!
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bun install --cwd lint --frozen-lockfile
          bun install --cwd core --frozen-lockfile
          bun install --cwd cli --frozen-lockfile
          bun run --cwd lint test
          (cd core && bun test)
          bun run --cwd cli check
          code=0
          wait "$claude_code" || code=$?
          cat "$RUNNER_TEMP/claude-code.log"
          [ "$code" = 0 ]
          test -d .claude-plugin/types

      - name: Test and build @cmodjs/core and @cmodjs/cli
        run: |
          bun run --cwd core check
          bun run --cwd core build
          bun run --cwd cli test

      - name: Test the cmod plugin on this @cmodjs/core
        run: |
          bun install --frozen-lockfile
          (cd core && bun pm pack --quiet --destination "$RUNNER_TEMP")
          rm -rf node_modules/@cmodjs/core
          mkdir node_modules/@cmodjs/core
          tar -xzf "$RUNNER_TEMP/cmodjs-core-${{ steps.version.outputs.version }}.tgz" -C node_modules/@cmodjs/core --strip-components=1
          bun test
          bun x tsc --noEmit
          OXLINT_TSGOLINT_PATH=lint/node_modules/.bin/tsgolint lint/node_modules/.bin/oxlint --type-aware --deny-warnings src hooks setup tests

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Test what runs only on macOS
        run: |
          bun install --cwd core --frozen-lockfile
          bun install --cwd cli --frozen-lockfile
          (cd core && bun test tests/register.test.ts)
          cd cli
          printf '%s\n' tests/install.test.ts tests/launcher.test.ts tests/secret.test.ts tests/try.test.ts | xargs -P 0 -n 1 bun test --timeout 30000

  release:
    needs: [test, macos]
    if: needs.test.outputs.core != 'done' || needs.test.outputs.cli != 'done' || needs.test.outputs.release != 'done'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Leave the release to main's run when main's workflows changed
        id: main
        run: |
          git fetch --quiet origin main
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .github/workflows; then
            echo "::notice::main's .github/workflows changed since $GITHUB_SHA, and GitHub refuses this run's token a tag whose workflows differ from main's, so the run for main releases"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.main.outputs.changed != 'true'
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        if: steps.main.outputs.changed != 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build @cmodjs/core into the cmod plugin, with Claude Code's types
        if: steps.main.outputs.changed != 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s latest
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          CLAUDE_CODE_PLUGIN_DIR_WATCH=1 "$HOME/.local/bin/claude" --plugin-dir . -p ok || true
          test -d .claude-plugin/types
          bun install --cwd core --frozen-lockfile
          bun install --cwd cli --frozen-lockfile
          bun install --frozen-lockfile
          bun run --cwd core build
          (cd core && bun pm pack --quiet --destination "$RUNNER_TEMP")
          rm -rf node_modules/@cmodjs/core
          mkdir node_modules/@cmodjs/core
          tar -xzf "$RUNNER_TEMP/cmodjs-core-${{ needs.test.outputs.version }}.tgz" -C node_modules/@cmodjs/core --strip-components=1

      - name: Publish @cmodjs/core to npm
        if: needs.test.outputs.core != 'done' && steps.main.outputs.changed != 'true'
        working-directory: core
        run: npm publish --provenance

      - name: Publish @cmodjs/cli to npm
        if: needs.test.outputs.cli != 'done' && steps.main.outputs.changed != 'true'
        working-directory: cli
        run: npm publish --provenance

      - name: Release the cmod plugin and the cmod program on GitHub
        if: needs.test.outputs.release != 'done' && steps.main.outputs.changed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun cli/src/main.ts publish
